  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 48px var(--pad);

    .lost .display { font-size: clamp(2.8rem, 10vw, 6rem); }
    .lost p { color: var(--text-dim); font-size: 1.1rem; }
    .lost__code { font-weight: 800; letter-spacing: .2em; color: var(--ember-hot); font-size: .85rem; }
  </style>

  <main class="lost">
    <div class="lost__inner">
      <img class="lost__flame" src="/assets/img/flame.svg" width="120" height="142" alt="">
